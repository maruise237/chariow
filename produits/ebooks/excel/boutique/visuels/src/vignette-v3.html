<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{width:1200px;height:1200px;background:var(--vf);position:relative;overflow:hidden;color:#fff}
/* Le téléphone déborde en bas : c'est l'objet réel, pas un décor */
.phone{position:absolute;right:70px;top:120px;transform:scale(.9);transform-origin:top right;box-shadow:0 40px 90px rgba(0,0,0,.45)}
.logo{position:absolute;left:84px;top:84px;font-size:24px;color:#fff}.logo img{width:40px;height:40px;filter:invert(1)}
h1{position:absolute;left:84px;top:200px;width:520px;font:800 108px/.95 'Cabinet Grotesk';letter-spacing:-.035em}
h1 em{font-style:normal;color:var(--a)}
.faits{position:absolute;left:86px;bottom:250px;font:600 30px/1.45 'Hanken Grotesk';color:rgba(255,255,255,.82)}
.prix{position:absolute;left:84px;bottom:110px;font:800 92px/1 'Cabinet Grotesk';letter-spacing:-.03em;color:var(--a)}
</style></head><body>
<div class="logo"><img src="img/logo-kamtech.png" alt="">KAMTECH</div>
<h1>Excel <em>sans apprendre</em> les formules</h1>
<p class="faits">E-book PDF · 227 pages<br>+ 7 modèles Excel en FCFA</p>
<p class="prix">2{f}500&nbsp;F</p>
<div class="phone"><div class="screen">{{statusbar}}
<div class="appbar"><span class="bk"></span><span>Excel sans formules.pdf</span><span class="pgn">1 / 227</span></div><div class="scroll"><img class="pg" src="img/n1-001.png" style="margin-top:10px"><img class="pg" src="img/n2-002.png"></div>
<div class="home"></div></div></div>
</body></html>

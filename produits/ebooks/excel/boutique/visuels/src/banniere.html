<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{width:1620px;height:600px;background:var(--vf);color:#fff;position:relative}
/* grille de tableur : bords seulement, le centre reste libre */
.cols{position:absolute;left:0;right:0;top:0;height:46px;background:#0b4526;display:flex;border-bottom:1px solid rgba(255,255,255,.14)}
.cols span,.rows span{color:#a9c4b3;font:600 20px 'Hanken Grotesk';display:flex;align-items:center;justify-content:center}
.cols span{width:270px;border-right:1px solid rgba(255,255,255,.14)}
.cols span:first-child{width:60px}
.rows{position:absolute;left:0;top:46px;bottom:0;width:60px;background:#0b4526;border-right:1px solid rgba(255,255,255,.14)}
.rows span{height:90px;border-bottom:1px solid rgba(255,255,255,.14)}
.g{position:absolute;inset:46px 0 0 60px;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:270px 90px;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 17%,transparent 27%,transparent 73%,#000 83%,#000 100%)}
.centre{position:absolute;left:0;right:0;top:46px;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(closest-side,transparent,transparent)}
.bloc{padding:0}
h1{font-size:84px;line-height:1}
.l2{margin-top:26px;font:600 30px 'Hanken Grotesk';color:#dfe9e2}
.l3{margin-top:18px;font:600 32px 'Hanken Grotesk'}
.l3 b{font:800 32px 'Cabinet Grotesk';color:var(--a)}
</style></head><body>
<div class="cols"><span></span><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span></div>
<div class="rows"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div>
<div class="g"></div>
<div class="centre"><div class="bloc">
<h1>Excel <em>sans apprendre</em><br>les formules</h1>
<p class="l2">129 pages · 35 prompts prêts à copier · 7 modèles Excel en FCFA</p>
<p class="l3"><b>2{f}500&nbsp;F</b> · kamtech.mychariow.com</p>
</div></div>
</body></html>

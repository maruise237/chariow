<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
/* Livre imprimé en volume : la vraie couverture du PDF, un dos, la tranche des pages, une ombre portée au sol. */
body{width:1200px;height:1200px;position:relative;overflow:hidden;background:#12924A}
body::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 42%,rgba(255,255,255,.10),transparent 70%);pointer-events:none}
.scene{position:absolute;left:452px;top:178px;width:672px;height:840px;perspective:2400px}
.livre{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(30deg) rotateX(2deg)}
.face{position:absolute}
.avant{width:672px;height:840px;background:url(img/n1-001.png) center/cover;border-radius:2px 6px 6px 2px;
  box-shadow:inset 6px 0 10px -4px rgba(0,0,0,.45),inset -1px 0 0 rgba(255,255,255,.08)}
/* charnière : léger pli près du dos */
.avant::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:3px;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.12),transparent)}
.dos{width:60px;height:840px;left:-58px;transform-origin:right;transform:rotateY(-90deg);
  background:linear-gradient(90deg,#03200f,#06331C 40%,#0a3f24 85%,#03200f);
  display:flex;align-items:center;justify-content:center}
.dos span{transform:rotate(90deg);white-space:nowrap;font:800 22px 'Cabinet Grotesk';color:#C8F05A;letter-spacing:.01em}
.tranche{width:58px;height:832px;top:4px;right:0;transform-origin:right;transform:rotateY(-90deg);
  background:repeating-linear-gradient(90deg,#f4f1e8 0 2px,#e2ddd0 2px 3px)}
.haut{width:672px;height:58px;top:0;transform-origin:top;transform:rotateX(-90deg);background:repeating-linear-gradient(0deg,#f4f1e8 0 2px,#e2ddd0 2px 3px)}
.ombre{position:absolute;left:380px;top:1010px;width:820px;height:110px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.38),rgba(0,0,0,0) 70%);filter:blur(6px)}
.bas{position:absolute;left:70px;bottom:62px;display:flex;align-items:baseline;gap:26px;color:#fff;font:700 32px 'Hanken Grotesk'}
.tablette{position:absolute;left:34px;top:150px;width:860px;height:700px;border-radius:38px;background:#1b1d1f;padding:22px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.tablette .ecran img{object-fit:contain;background:#fff}
.tablette .ecran{width:100%;height:100%;border-radius:18px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.tablette .barre{height:54px;flex:none;background:#107C41;color:#fff;display:flex;align-items:center;padding:0 22px;font:700 22px 'Hanken Grotesk';gap:12px}
.tablette .barre i{font-style:normal;background:#fff;color:#107C41;border-radius:6px;padding:2px 8px;font-size:18px}
.tablette img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.etiquette{position:absolute;left:70px;top:70px;color:#fff;font:800 40px/1.1 'Cabinet Grotesk';letter-spacing:-.02em}
.etiquette em{font-style:normal;color:#C8F05A}
.bas b{font:800 78px 'Cabinet Grotesk';letter-spacing:-.03em;color:#fff}
.bas i{font-style:normal;color:#C8F05A}
</style></head><body>
<div class="tablette"><div class="ecran"><div class="barre"><i>X</i>7-Ventes-du-mois.xlsx</div><img src="img/c4-graph.png" alt=""></div></div>
<div class="ombre"></div>
<div class="scene"><div class="livre">
  <div class="face haut"></div>
  <div class="face tranche"></div>
  <div class="face dos"><span>Excel sans apprendre les formules · KAMTECH</span></div>
  <div class="face avant"></div>
</div></div>
</body></html>
